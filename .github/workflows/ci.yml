name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests + schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install jq (hook tests)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git identity (hook/script tests use temp repos)
        run: |
          git config --global user.email "ci@composer.local"
          git config --global user.name "composer-ci"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/integration tests
        run: npm run test

      - name: Hook tests
        run: npm run test:hooks

      - name: Script tests
        run: npm run test:scripts

      - name: Schema lint
        run: npm run schema:lint

      - name: Speed budgets (p95)
        run: node --import tsx scripts/bench-composer.mjs

  bash-compat:
    name: bash-compat (macOS / Bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install jq (hook tests)
        run: brew install jq
      - name: Configure git identity (hook/script tests use temp repos)
        run: |
          git config --global user.email "ci@composer.local"
          git config --global user.name "composer-ci"
          git config --global init.defaultBranch main
      - name: Install dependencies
        run: npm ci
      - name: Hook tests (Bash 3.2)
        run: npm run test:hooks
      - name: Script tests (Bash 3.2)
        run: npm run test:scripts
      - name: Packaging guard (oracle scripts + schema shipped)
        run: |
          out=$(npm pack --dry-run 2>&1)
          for f in scripts/oracle-pro-safe.sh scripts/oracle-plan-mcp.sh scripts/oracle-codex-handoff-safe.sh scripts/composer-oracle-router-safe.sh composer.config.schema.json; do
            echo "$out" | grep -q "$f" || { echo "MISSING from npm package: $f"; exit 1; }
          done
          echo "packaging guard ok"
